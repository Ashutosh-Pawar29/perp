apiVersion: v1
kind: ConfigMap
metadata:
  name: perpetua-config
  namespace: perpetua
data:
  PORT: "3000"
  REDIS_URL: "redis://redis-service:6379"
---

apiVersion: v1
kind: Secret
metadata:
  name: perpetua-secret
  namespace: perpetua
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:password123@postgres-service:5432/perps_v2?schema=public"
  JWT_SECRET: "jwt-secret"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "password123"
  POSTGRES_DB: "perps_v2"

